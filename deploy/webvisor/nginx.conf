server {
  listen 80 default_server;
  server_name _;

  # Сохраняем те же правила кеширования, что и у Nitro: latest.json должен
  # быстро обновляться, остальные хэшированные файлы можно держать год.
  location ^~ /_nuxt/builds/meta/ {
    root /srv;
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ^~ /_nuxt/builds/ {
    root /srv;
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=1" always;
  }

  location ^~ /_nuxt/ {
    root /srv;
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    return 404;
  }
}
