# Прод-компоуз Гласно. Копируется на сервер в /opt/glasno/prod/docker-compose.yml.
# Traefik (общий, из /opt/mentala/proxy) маршрутизирует по labels через внешнюю
# сеть proxy. Ничего из инфраструктуры Mentala здесь не переиспользуется:
# свои postgres/redis/volumes, уникальные имена роутеров glasno-*.
#
# КРИТИЧНО: name задаёт имя compose-проекта. Без него проект берётся из имени
# папки (prod) и КОНФЛИКТУЕТ с проектом Mentala (/opt/mentala/prod → тоже
# prod): compose «пересоздаёт» чужие сервисы. Не удалять и не переименовывать.
name: glasno-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: glasno-postgres-prod
    environment:
      POSTGRES_DB: glasno
      POSTGRES_USER: glasno_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 5434 — только для админ-доступа с хоста (5432/5433 заняты Mentala).
    # Приложение ходит по docker-сети: postgres:5432.
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U glasno_user -d glasno']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: glasno-redis-prod
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # 6381 — только для админ-доступа с хоста (6379/6380 заняты Mentala).
    ports:
      - '127.0.0.1:6381:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Без container_name — чтобы работал blue/green (docker compose up --scale web=2).
  web:
    image: ${APP_IMAGE}
    env_file:
      - .env
    volumes:
      # Файлы переживают замену образа, чтобы Webvisor мог открыть запись с
      # прошлым CSS/JS-хэшем. Текущие ассеты копирует entrypoint образа.
      - webvisor-assets:/app/.output/public/_nuxt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', '--tries=1', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    networks:
      - default
      - proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'

      # Service (Nuxt)
      - 'traefik.http.services.glasno-prod.loadbalancer.server.port=3000'

      # Router: приложение (my.glasno.app)
      - 'traefik.http.routers.glasno-prod-app.rule=Host(`my.glasno.app`)'
      - 'traefik.http.routers.glasno-prod-app.entrypoints=websecure'
      - 'traefik.http.routers.glasno-prod-app.tls=true'
      - 'traefik.http.routers.glasno-prod-app.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.glasno-prod-app.service=glasno-prod'
      - 'traefik.http.routers.glasno-prod-app.priority=100'

  # Nitro знает только файлы из манифеста текущей сборки. Этот маршрут
  # обслуживает сохранённые /_nuxt/** напрямую, включая хэши старых записей
  # Webvisor. Приоритет выше общего маршрута приложения.
  webvisor-static:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - webvisor-assets:/srv/_nuxt:ro
      - ./webvisor/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'
      - 'traefik.http.services.glasno-webvisor-static.loadbalancer.server.port=80'
      - 'traefik.http.routers.glasno-prod-webvisor-assets.rule=Host(`my.glasno.app`) && PathPrefix(`/_nuxt/`)'
      - 'traefik.http.routers.glasno-prod-webvisor-assets.entrypoints=websecure'
      - 'traefik.http.routers.glasno-prod-webvisor-assets.tls=true'
      - 'traefik.http.routers.glasno-prod-webvisor-assets.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.glasno-prod-webvisor-assets.service=glasno-webvisor-static'
      - 'traefik.http.routers.glasno-prod-webvisor-assets.priority=200'

  landing:
    image: nginx:alpine
    container_name: glasno-landing-prod
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - /var/www/glasno-landing:/srv/landing:ro
      - ./landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'

      # Service (Nginx)
      - 'traefik.http.services.glasno-landing-prod.loadbalancer.server.port=80'

      # Redirect: www -> apex ($$ — чтобы docker-compose передал $1 в Traefik)
      - 'traefik.http.middlewares.glasno-www-to-apex.redirectregex.regex=^https://www\.glasno\.app/(.*)$$'
      - 'traefik.http.middlewares.glasno-www-to-apex.redirectregex.replacement=https://glasno.app/$$1'
      - 'traefik.http.middlewares.glasno-www-to-apex.redirectregex.permanent=true'

      # Redirect: продуктовые пути с лендинга -> приложение
      - 'traefik.http.middlewares.glasno-redirect-to-my.redirectregex.regex=^https://glasno\.app/(auth|history|pricing|profile|questions|interview)(/.*)?$$'
      - 'traefik.http.middlewares.glasno-redirect-to-my.redirectregex.replacement=https://my.glasno.app/$$1$$2'
      - 'traefik.http.middlewares.glasno-redirect-to-my.redirectregex.permanent=true'

      # Router: лендинг (apex)
      - 'traefik.http.routers.glasno-landing.rule=Host(`glasno.app`)'
      - 'traefik.http.routers.glasno-landing.entrypoints=websecure'
      - 'traefik.http.routers.glasno-landing.tls=true'
      - 'traefik.http.routers.glasno-landing.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.glasno-landing.middlewares=glasno-redirect-to-my'
      - 'traefik.http.routers.glasno-landing.service=glasno-landing-prod'

      # Router: www (redirect на apex)
      - 'traefik.http.routers.glasno-landing-www.rule=Host(`www.glasno.app`)'
      - 'traefik.http.routers.glasno-landing-www.entrypoints=websecure'
      - 'traefik.http.routers.glasno-landing-www.tls=true'
      - 'traefik.http.routers.glasno-landing-www.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.glasno-landing-www.middlewares=glasno-www-to-apex'
      - 'traefik.http.routers.glasno-landing-www.service=glasno-landing-prod'

  migrate:
    image: ${MIGRATE_IMAGE}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    # Запускается только вручную/из CI: docker compose run --rm migrate pnpm db:migrate
    profiles:
      - tools

volumes:
  pgdata:
  redis-data:
  webvisor-assets:

networks:
  proxy:
    external: true
