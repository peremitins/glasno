server {
  listen 80;
  server_name _;

  root /srv/landing/current;
  index index.html;

  # --- INDEX ---

  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # --- STATIC ASSETS ---

  # Nuxt генерирует иммутабельные имена файлов с хешем содержимого. Храним их
  # отдельно от релизов, пока Вебвизор может воспроизводить посещения: иначе
  # запись старой страницы останется без CSS после переключения current.
  location ^~ /_nuxt/ {
    root /srv/landing/webvisor-assets;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* ^/assets/.+\.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # --- GZIP ---

  gzip on;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript
    image/svg+xml;
  gzip_min_length 1024;

  # --- NOT FOUND ---

  # Лендинг — статика с заранее отрендеренным списком страниц (см.
  # nitro.prerender.routes), клиентский роутинг по неизвестным путям ему не
  # нужен. Раньше здесь стоял SPA-фолбэк на /index.html: любой опечатанный или
  # выдуманный адрес отвечал 200 и главной страницей. Для поисковика это
  # бесконечные дубли одной страницы, а Search Console из-за такого ответа
  # заваливает подтверждение прав HTML-файлом — оно ждёт 404 на заведомо
  # несуществующем файле. Отдаём честный 404 со страницей, которую генерирует
  # Nuxt.
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
  }
}
