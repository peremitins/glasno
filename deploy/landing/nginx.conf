server {
  listen 80;
  server_name _;

  root /srv/landing/current;
  index index.html;

  # --- INDEX ---

  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # --- STATIC ASSETS ---

  # Nuxt генерирует иммутабельные имена файлов с хешем содержимого. Храним их
  # отдельно от релизов, пока Вебвизор может воспроизводить посещения: иначе
  # запись старой страницы останется без CSS после переключения current.
  location ^~ /_nuxt/ {
    root /srv/landing/webvisor-assets;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* ^/assets/.+\.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # --- GZIP ---

  gzip on;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript
    image/svg+xml;
  gzip_min_length 1024;

  # --- SPA FALLBACK ---

  location / {
    try_files $uri $uri/ /index.html;
  }
}
