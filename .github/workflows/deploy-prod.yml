name: Deploy PROD to glasno.app

# Одно окружение: push в main деплоит приложение (my.glasno.app) всегда,
# лендинг (glasno.app) — только если менялись файлы apps/landing/**.
# workflow_dispatch запускает оба job'а принудительно.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.app-filter.outputs.app }}
      landing: ${{ steps.landing-filter.outputs.landing }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Для приложения нужны исключения, поэтому путь должен совпасть со
      # всеми правилами: включающим и исключающими.
      - name: Filter application paths
        id: app-filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: 'every'
          filters: |
            app:
              - '**'
              - '!apps/landing/**'
              - '!.docs/**'
              - '!**/*.md'

      # Для лендинга достаточно изменения любого из его путей. Нельзя
      # объединять этот фильтр с `app-filter`: `every` потребовал бы, чтобы
      # один файл одновременно совпал со всеми тремя каталогами.
      - name: Filter landing paths
        id: landing-filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: 'some'
          filters: |
            landing:
              - 'apps/landing/**'
              - 'deploy/landing/**'
              - '.github/workflows/deploy-prod.yml'

  # Ранняя диагностика секретов: падает с понятной ошибкой ДО сборки,
  # если PROD_SSH_KEY пуст или не парсится как приватный ключ.
  preflight:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        env:
          KEY: ${{ secrets.PROD_SSH_KEY }}
          HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          echo "PROD_SSH_HOST: длина ${#HOST}"
          echo "PROD_SSH_USER: длина ${#SSH_USER}"
          echo "PROD_SSH_KEY:  длина ${#KEY} символов, строк: $(printf '%s\n' "$KEY" | wc -l)"
          if [ -z "$KEY" ]; then
            echo "::error::Секрет PROD_SSH_KEY пуст или не задан (проверь имя и раздел Repository secrets)"
            exit 1
          fi
          printf '%s\n' "$KEY" > key.tmp && chmod 600 key.tmp
          if ! head -1 key.tmp | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "::error::Первая строка секрета — не '-----BEGIN OPENSSH PRIVATE KEY-----'. Похоже, вставлен не приватный ключ."
            exit 1
          fi
          if ssh-keygen -y -P "" -f key.tmp >/dev/null 2>&1; then
            echo "OK: ключ валиден, fingerprint: $(ssh-keygen -lf key.tmp)"
          else
            echo "::error::Ключ не парсится (повреждён формат или есть парольная фраза)"
            exit 1
          fi
          rm -f key.tmp

      - name: Validate GHCR_PAT (docker login)
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          echo "GHCR_USERNAME: длина ${#GHCR_USERNAME}; GHCR_PAT: длина ${#GHCR_PAT}"
          if [ -z "$GHCR_PAT" ]; then
            echo "::error::Секрет GHCR_PAT пуст. Нужен classic PAT (ghp_...) со scope read:packages"
            exit 1
          fi
          case "$GHCR_PAT" in
            ghp_*|github_pat_*) : ;;
            *) echo "::error::GHCR_PAT не похож на GitHub-токен (должен начинаться с ghp_). Похоже, вставлено другое значение."; exit 1 ;;
          esac
          if echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null 2>&1; then
            echo "OK: docker login в ghcr.io прошёл"
          else
            echo "::error::docker login ghcr.io отклонён — токен невалиден, истёк или без scope read:packages"
            exit 1
          fi

  deploy-landing:
    name: Deploy landing to PROD
    needs: [changes, preflight]
    if: needs.changes.outputs.landing == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing (static export)
        run: pnpm landing:generate
        env:
          NUXT_PUBLIC_APP_AUTH_URL: https://my.glasno.app/auth
          NUXT_PUBLIC_LANDING_SITE_URL: https://glasno.app

      - name: Prepare SSH key for landing deploy
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/landing_deploy_key
          chmod 600 ~/.ssh/landing_deploy_key
          ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy landing to PROD (versioned assets + symlink)
        run: |
          RELEASE_ID=${{ github.run_id }}-${{ github.run_attempt }}
          ssh -i ~/.ssh/landing_deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} "mkdir -p /var/www/glasno-landing/releases /var/www/glasno-landing/webvisor-assets/_nuxt; if [ -d /var/www/glasno-landing/current/_nuxt ]; then cp -an /var/www/glasno-landing/current/_nuxt/. /var/www/glasno-landing/webvisor-assets/_nuxt/; fi"
          rsync -avz -e "ssh -i ~/.ssh/landing_deploy_key -o StrictHostKeyChecking=no" \
            deploy/landing/nginx.conf \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/opt/glasno/prod/landing/nginx.conf
          rsync -avz --delete -e "ssh -i ~/.ssh/landing_deploy_key -o StrictHostKeyChecking=no" \
            apps/landing/.output/public/ \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/var/www/glasno-landing/releases/${RELEASE_ID}/
          # Обновляем mtime и для неизменившихся хэшей текущей версии: иначе
          # очистка спустя 30 дней могла удалить активный CSS из Webvisor cache.
          rsync -avz --ignore-times --no-times -e "ssh -i ~/.ssh/landing_deploy_key -o StrictHostKeyChecking=no" \
            apps/landing/.output/public/_nuxt/ \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/var/www/glasno-landing/webvisor-assets/_nuxt/
          ssh -i ~/.ssh/landing_deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
            "set -euo pipefail; WEBVISOR_ASSET_RETENTION_DAYS=30; docker exec glasno-landing-prod nginx -t; docker exec glasno-landing-prod nginx -s reload; cd /var/www/glasno-landing; ln -sfn \"releases/${RELEASE_ID}\" current; find webvisor-assets/_nuxt -type f -mtime +\${WEBVISOR_ASSET_RETENTION_DAYS} -delete; find webvisor-assets/_nuxt -type d -empty -delete; cd releases; for d in \$(ls -t | tail -n +6); do chmod -R u+w \"\$d\" 2>/dev/null || true; rm -rf \"\$d\" || true; done"

  deploy-app:
    name: Deploy app to PROD
    needs: [changes, preflight]
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/glasno:prod-latest
      MIGRATE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/glasno:prod-migrate
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/glasno:prod-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/glasno:prod-buildcache,mode=max

      - name: Build and push migrate Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.MIGRATE_IMAGE_NAME }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/glasno:prod-buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/glasno:prod-buildcache,mode=max

      - name: Sync application deployment configuration
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/app_deploy_key
          chmod 600 ~/.ssh/app_deploy_key
          ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/app_deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
            'mkdir -p /opt/glasno/prod/webvisor'
          scp -i ~/.ssh/app_deploy_key -o StrictHostKeyChecking=no \
            deploy/docker-compose.prod.yml \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/opt/glasno/prod/docker-compose.yml
          scp -i ~/.ssh/app_deploy_key -o StrictHostKeyChecking=no \
            deploy/webvisor/nginx.conf \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/opt/glasno/prod/webvisor/nginx.conf

      - name: Deploy to PROD server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          envs: GHCR_PAT,GHCR_USERNAME
          script: |
            set -euo pipefail

            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            cd /opt/glasno/prod
            grep -q '^APP_IMAGE=' .env \
              && sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${{ env.IMAGE_NAME }}|" .env \
              || echo "APP_IMAGE=${{ env.IMAGE_NAME }}" >> .env
            grep -q '^MIGRATE_IMAGE=' .env \
              && sed -i "s|^MIGRATE_IMAGE=.*|MIGRATE_IMAGE=${{ env.MIGRATE_IMAGE_NAME }}|" .env \
              || echo "MIGRATE_IMAGE=${{ env.MIGRATE_IMAGE_NAME }}" >> .env
            # NUXT_PUBLIC_YANDEX_METRIKA_ID переопределяет вложенный конфиг
            # модуля и превращает строковый ID в число. Удаляем старое значение.
            sed -i '/^NUXT_PUBLIC_YANDEX_METRIKA_ID=/d' .env

            # Telegram-уведомления о деплое (опционально, креды из .env).
            TG_TOKEN=$(grep -E '^NUXT_TELEGRAM_ALERTS_BOT_TOKEN=' .env 2>/dev/null | cut -d= -f2- | tr -d '"' || true)
            TG_CHAT=$(grep -E '^NUXT_TELEGRAM_ALERTS_CHAT_ID=' .env 2>/dev/null | cut -d= -f2- | tr -d '"' || true)
            notify_tg() {
              local text="$1"
              [ -z "${TG_TOKEN:-}" ] && return 0
              [ -z "${TG_CHAT:-}" ] && return 0
              curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d "chat_id=${TG_CHAT}" \
                --data-urlencode "text=${text}" \
                -d "parse_mode=Markdown" \
                -d "disable_web_page_preview=true" \
                >/dev/null 2>&1 || true
            }

            # Лёгкая pre-deploy очистка: НЕ трогаем рабочие образы и их слои.
            light_cleanup() {
              docker ps -aq --filter "name=migrate-run" | xargs -r docker rm -f || true
              docker container prune -f || true
              docker image prune -f || true
              docker builder prune -f --keep-storage 4GB || true
            }

            pull_with_retry() {
              local svc="$1"
              for i in 1 2 3; do
                docker compose pull "$svc" && return 0
                echo "Pull $svc failed (attempt ${i}/3). Light cleanup before retry."
                light_cleanup
                sleep 5
              done
              echo "Failed to pull $svc after 3 attempts"
              return 1
            }

            wait_until_healthy() {
              local max_seconds="${1:-90}"
              local waited=0
              while [ "$waited" -lt "$max_seconds" ]; do
                local ids
                ids=$(docker compose ps -q web)
                if [ -z "$ids" ]; then
                  echo "no web containers yet"; sleep 2; waited=$((waited+2)); continue
                fi
                local all_ok=1
                for id in $ids; do
                  local status
                  status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$id" 2>/dev/null || echo "unknown")
                  case "$status" in
                    healthy) ;;
                    no-healthcheck)
                      local running
                      running=$(docker inspect --format='{{.State.Running}}' "$id" 2>/dev/null || echo "false")
                      [ "$running" = "true" ] || all_ok=0
                      ;;
                    *) all_ok=0 ;;
                  esac
                done
                if [ "$all_ok" -eq 1 ]; then
                  echo "web healthy after ${waited}s"
                  return 0
                fi
                sleep 2; waited=$((waited+2))
              done
              echo "web did not become healthy within ${max_seconds}s"
              docker compose ps
              docker compose logs --tail=80 web || true
              return 1
            }

            # Первый rollout переносит ассеты уже работающего приложения в
            # named volume до его пересоздания. Иначе CSS-хэши текущего релиза
            # исчезнут ровно в момент включения защиты Webvisor.
            seed_existing_webvisor_assets() {
              local volume_name='glasno-prod_webvisor-assets'
              local existing_web
              local new_web_image
              local staging_container

              docker volume create "$volume_name" >/dev/null
              existing_web=$(docker compose ps -q web | head -n 1)
              if [ -z "$existing_web" ]; then
                echo "No previous web container: Webvisor volume starts empty."
                return 0
              fi

              new_web_image=$(grep -E '^APP_IMAGE=' .env | cut -d= -f2- | tr -d '"')
              if [ -z "$new_web_image" ]; then
                echo "APP_IMAGE is missing; cannot seed Webvisor assets" >&2
                return 1
              fi

              staging_container=$(docker create \
                --entrypoint sh \
                -v "$volume_name:/target" \
                "$new_web_image" \
                -c 'exit 0')

              if ! docker cp "$existing_web:/app/.output/public/_nuxt/." - \
                | docker cp - "$staging_container:/target"; then
                docker rm -f "$staging_container" >/dev/null || true
                return 1
              fi

              docker rm "$staging_container" >/dev/null
              echo "Webvisor assets copied from the previous web container."
            }

            light_cleanup

            pull_with_retry web
            pull_with_retry migrate

            seed_existing_webvisor_assets

            PREV_WEB_IMAGE=$(docker compose ps -q web | head -1 | xargs -r docker inspect --format='{{.Image}}' || true)
            echo "Previous web image digest: ${PREV_WEB_IMAGE:-<none>}"

            # Миграции — ДО переключения web: старый код должен работать на новой схеме.
            docker compose run --rm migrate pnpm db:migrate

            DEPLOY_STRATEGY=$(grep -E '^DEPLOY_STRATEGY=' .env | cut -d= -f2- || true)
            DEPLOY_OK=0
            if [ "${DEPLOY_STRATEGY:-recreate}" = "bluegreen" ]; then
              echo "blue/green deploy"
              docker compose up -d --no-deps --scale web=2 --no-recreate web && \
              wait_until_healthy 120 && \
              docker compose up -d --no-deps --scale web=1 web && \
              wait_until_healthy 60 && DEPLOY_OK=1
            else
              echo "recreate deploy"
              docker compose up -d --no-deps --remove-orphans web
              if wait_until_healthy 90; then
                DEPLOY_OK=1
              else
                if [ -n "$PREV_WEB_IMAGE" ]; then
                  echo "rollback to $PREV_WEB_IMAGE"
                  docker tag "$PREV_WEB_IMAGE" "${{ env.IMAGE_NAME }}"
                  docker compose up -d --no-deps --force-recreate web
                  notify_tg "🔁 *Deploy glasno [prod] rolled back*
            New image failed healthcheck, restored previous digest."
                fi
              fi
            fi

            if [ "${DEPLOY_OK}" -eq 1 ]; then
              docker compose up -d --no-deps webvisor-static
              notify_tg "✅ *Deploy glasno [prod] success* (strategy: ${DEPLOY_STRATEGY:-recreate})"
            else
              notify_tg "❌ *Deploy glasno [prod] FAILED* (strategy: ${DEPLOY_STRATEGY:-recreate})"
              exit 1
            fi

      - name: Cleanup Docker resources on PROD server
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script: |
            set -u

            cd /opt/glasno/prod

            # Точечная очистка: оставляем образы работающих контейнеров,
            # удаляем устаревшие версии образа glasno.
            ACTIVE_IMAGE_IDS=$(docker compose ps -q | xargs -r docker inspect --format='{{.Image}}' | sort -u)

            docker ps -aq --filter "name=migrate-run" | xargs -r docker rm -f || true
            docker container prune -f || true

            for repo in \
              "ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/glasno"; do
              docker images "$repo" --format '{{.ID}}' | sort -u | while read -r img; do
                if ! echo "$ACTIVE_IMAGE_IDS" | grep -q "$img"; then
                  docker rmi -f "$img" >/dev/null 2>&1 || true
                fi
              done
            done

            docker image prune -f || true
            docker builder prune -f --keep-storage 4GB || true

            df -h /
            docker system df || true
